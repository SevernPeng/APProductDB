[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
testpaths = ["app"]
pythonpath = ["app"]
addopts = "--strict-markers"
filterwarnings = [
    "ignore:The default scheme will be changed from 'http' to 'https'.*:django.utils.deprecation.RemovedInDjango60Warning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["app/*/migrations", "datasets"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["E501", "DJ001", "DJ008", "DJ012"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "audit", "catalog", "changes", "comparison", "config", "core", "imports"]
