<div class="product-autocomplete" data-product-autocomplete>
  <input
    class="form-control"
    type="search"
    id="product-picker-{{ input_id }}"
    value="{% if selected %}{{ selected.brand.name }} {{ selected.model }} · {{ selected.category.name }} · {{ selected.region }}{% if selected.hardware_version %} · {{ selected.hardware_version }}{% endif %}{% endif %}"
    placeholder="{{ placeholder|default:'Search by brand or model' }}"
    autocomplete="off"
    role="combobox"
    aria-autocomplete="list"
    aria-expanded="false"
    aria-controls="product-picker-{{ input_id }}-suggestions"
    {% if required %}required{% endif %}
    data-product-search
  >
  <input type="hidden" name="{{ input_name }}" value="{% if selected %}{{ selected.pk }}{% endif %}" data-product-value>
  <div class="product-autocomplete-menu list-group d-none" id="product-picker-{{ input_id }}-suggestions" role="listbox" data-product-menu>
    {% for option in options %}
      <button
        class="list-group-item list-group-item-action product-autocomplete-option"
        type="button"
        role="option"
        data-product-option
        data-value="{{ option.pk }}"
        data-label="{{ option.brand.name }} {{ option.model }} · {{ option.category.name }} · {{ option.region }}{% if option.hardware_version %} · {{ option.hardware_version }}{% endif %}"
        data-search="{{ option.brand.name }} {{ option.model }} {{ option.category.name }} {{ option.region }} {{ option.hardware_version }}"
      ><span class="d-flex align-items-center justify-content-between gap-2"><strong>{{ option.brand.name }} {{ option.model }}</strong>{% if option.is_benchmark_suggestion %}<span class="badge rounded-pill text-bg-primary fw-normal">Benchmark</span>{% endif %}</span><small class="text-body-secondary d-block">{{ option.category.name }} · {{ option.region }}{% if option.hardware_version %} · {{ option.hardware_version }}{% endif %}</small></button>
    {% empty %}
      <div class="list-group-item text-body-secondary">No products available</div>
    {% endfor %}
    <div class="list-group-item text-body-secondary d-none" data-product-empty>No matching products</div>
  </div>
  <div class="invalid-feedback">Select a valid product from the suggestions.</div>
</div>
