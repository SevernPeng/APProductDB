{% extends "base.html" %}
{% block title %}Sign In · APProductDB{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-4">Sign In</h1>
        {% if form.errors %}
          <div class="alert alert-danger" role="alert">Incorrect username or password.</div>
        {% endif %}
        <form method="post" novalidate>
          {% csrf_token %}
          {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
          <div class="mb-3">
            <label for="id_username" class="form-label">Company email or root username</label>
            <input type="text" name="username" id="id_username" class="form-control" autocomplete="username" autofocus required>
          </div>
          <div class="mb-4">
            <label for="id_password" class="form-label">Password</label>
            <input type="password" name="password" id="id_password" class="form-control" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Sign In</button>
        </form>
        <p class="text-center text-secondary small mt-3 mb-0">No account? <a href="{% url 'accounts:register' %}">Register with your company email</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
